<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROTK · Multiplayer Lobby</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(ellipse at top,#263d52,#09131f 75%);color:#eee2c9;font:15px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(1050px,96vw);background:#152638ee;border:1px solid #b69a5e;border-radius:16px;padding:28px;box-shadow:0 24px 70px #0008}h1{font:700 32px Georgia;margin:0 0 8px;color:#f4d28d}.sub{color:#b7c3ce;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border-radius:7px;background:#22394d;color:#fff;border:1px solid #748598}button{cursor:pointer;background:#795b2e;border-color:#bd9d5c}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.faction{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1c3043;border:1px solid #42576b;border-radius:10px;padding:14px;margin:10px 0}.faction strong{font:700 23px Georgia}.faction small{display:block;color:#9bb0bd}.controls{display:flex;gap:6px}.controls button{font-size:13px;padding:7px 11px}.wei{color:#80b7fa}.shu{color:#7ddca6}.wu{color:#f79a89}#msg{min-height:24px;color:#f0b28f}#gameLink{overflow-wrap:anywhere}.muted{font-size:12px;color:#9db0bf}#waiting{display:none}.faction-benefits{background:#0e2130;border:1px solid #52667a;border-radius:9px;padding:11px 14px;margin:12px 0;line-height:1.8;font-size:13px}

.community{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:14px;margin-top:18px}.panel{background:#0d2030;border:1px solid #465e70;border-radius:10px;padding:12px;min-width:0}.panel h2{font:700 19px Georgia;color:#f4d28d;margin:0 0 10px}.chatlog{height:250px;overflow-y:auto;background:#091825;border-radius:7px;padding:10px;overflow-wrap:anywhere}.chatline{margin:0 0 9px;line-height:1.4}.chatline small{color:#91a6b6}.chatline b{color:#f4d28d}.chatline a,.roomitem a{color:#9acfff}.chatinput{display:flex;gap:7px;margin-top:10px}.chatinput input{flex:1;min-width:0}.chatinput button{white-space:nowrap}.roomlist{height:250px;overflow-y:auto}.roomitem{padding:9px 4px;border-bottom:1px solid #304455;display:flex;justify-content:space-between;gap:8px;align-items:center}.roomitem button{padding:5px 9px;font-size:12px}.invitebutton{margin-top:9px;font-size:13px}.chatstatus{font-size:12px;color:#d9b18d;min-height:16px;margin-top:4px}@media(max-width:720px){.community{grid-template-columns:1fr}.chatlog,.roomlist{height:210px}main{padding:16px}}

/* Compact single-screen desktop lobby */
.buildversion{font-size:11px;font-weight:normal;color:#aab8c8;vertical-align:middle;margin-left:7px}
body{display:block;min-height:100dvh;font-size:12px;overflow:hidden}
main{width:100%;max-width:1700px;height:100dvh;min-height:0;margin:auto;padding:12px 14px;border-radius:0;display:flex;flex-direction:column;box-shadow:none}
.topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:0 2px 9px}
h1{font-size:21px;margin:0}.topbar .muted{font-size:11px}
.community.workspace{display:grid;grid-template-columns:minmax(240px,1.05fr) minmax(210px,.85fr) minmax(345px,1.35fr);gap:10px;flex:1;min-height:0;margin:0}
.panel{display:flex;flex-direction:column;min-height:0;padding:10px;overflow:hidden}
.panel h2{font-size:15px;margin:0 0 8px}
.chatlog,.roomlist{height:auto;min-height:0;flex:1;overflow-y:auto}
.chatlog{padding:8px;font-size:12px}.chatline{margin-bottom:7px;line-height:1.35}
.roomitem{padding:7px 3px}.roomitem button{font-size:11px;padding:4px 7px}
input,select,button{font-size:12px;padding:6px 7px;border-radius:5px}
.chatinput{margin-top:7px}.invitebutton{font-size:11px;margin-top:7px;align-self:flex-start}
.chatstatus{font-size:11px}
.roomsettings{display:grid;grid-template-columns:1fr 1fr 65px;gap:6px}
.roomsettings label{font-size:10px;color:#b7c3ce;display:flex;flex-direction:column;gap:3px}
.roomsettings input,.roomsettings select{width:100%;min-width:0}
.roomactions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#msg{min-height:18px;font-size:11px;margin:1px 0;color:#f0b28f}
.faction-benefits{display:flex;flex-wrap:wrap;gap:5px 10px;padding:7px;margin:5px 0;font-size:10px;line-height:1.25}
.faction{padding:8px;margin:5px 0;border-radius:7px;gap:5px}
.faction strong{font-size:17px}.faction small{font-size:10px}
.controls{gap:4px}.controls button{font-size:11px;padding:5px 7px}
.bottomactions{margin:8px 0 2px}.roomhint{font-size:10px;margin:5px 0}
@media(max-width:850px){body{overflow:auto}main{height:auto;min-height:100dvh}.community.workspace{grid-template-columns:1fr;min-height:auto}.panel{min-height:260px}.chatlog,.roomlist{min-height:180px;max-height:300px}.detailpanel{min-height:0}}
@media(max-height:620px) and (min-width:851px){main{padding:7px 10px}.topbar{padding-bottom:5px}.panel{padding:7px}.faction{padding:5px;margin:3px 0}.faction-benefits{padding:5px;margin:3px 0}.panel h2{margin-bottom:5px}}

.buildversion{font:normal 11px system-ui;color:#aab8c8;margin-left:7px}
.playerlabel{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#b7c3ce;margin-bottom:10px}
.playerlabel input{width:100%}
.createroom{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;align-items:end;gap:5px}
.createroom label{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:10px;color:#b7c3ce}
.createroom input,.createroom select{width:100%;min-width:0}
.createroom button{white-space:nowrap}
#createhint{margin:6px 0 14px;font-size:10px}
.listheading{margin-top:4px!important}
#roomdetail[hidden]{display:none!important}
#roomtitle{color:#a8d7fa}
.roompanel .roomlist{min-height:0}
.roomitem.active{background:#1b3d52;border-radius:5px}
@media(min-width:851px){.community.workspace{grid-template-columns:minmax(240px,1.05fr) minmax(245px,.9fr) minmax(340px,1.35fr)}.community.workspace:not(.has-room){grid-template-columns:minmax(300px,1fr) minmax(300px,1fr)} }
</style></head><body><main>
<header class="topbar"><h1>⚔ Three Kingdoms <small class="buildversion">v3.5.21</small></h1><span class="muted">Multiplayer lobby</span></header>
<div class="community workspace">
<section class="panel chatpanel"><label class="playerlabel">Player Name <input id="name" maxlength="24" placeholder="Your name"></label><h2>💬 Lobby Chat</h2><div id="chatlog" class="chatlog" aria-live="polite"></div><form id="chatform" class="chatinput"><input id="chattext" maxlength="280" placeholder="Chat with players…" autocomplete="off" required><button type="submit">Send</button></form><div class="chatstatus" id="chatstatus"></div></section>
<section class="panel roompanel"><h2>🏯 Create Room</h2><div class="createroom"><label>Room Code <input id="code" maxlength="12" placeholder="MYROOM"></label><label>Turn <select id="mode"><option value="20">20s</option><option value="60">60s</option><option value="180">3m</option><option value="300" selected>5m</option></select></label><button id="create">Create</button></div><div id="createhint" class="muted">One active room at a time.</div><h2 class="listheading">Available Rooms</h2><div id="roomlist" class="roomlist"></div></section>
<section id="roomdetail" class="panel detailpanel" hidden><h2>⚔ Room <span id="roomtitle"></span></h2><div class="roomactions"><button id="open" style="display:none">Refresh</button><button id="copy">Copy Link</button></div><div id="msg"></div><div class="faction-benefits"><span class="wei">魏 Wei: +troops</span><span class="shu">蜀 Shu: +1 S starter</span><span class="wu">吳 Wu: +gold/food</span></div><section id="slots"></section><div class="roomactions bottomactions"><button id="start" style="display:none">▶ Start Game</button><button id="enter" style="display:none">Enter Game</button><button id="invite">📨 Share Room</button><button id="exit">Exit Room</button><span id="waiting" class="muted">Waiting for host…</span></div><p class="muted roomhint">Host can assign AI to open slots. All factions must be occupied to start.</p></section>
</div></main>
<script>
const $=id=>document.getElementById(id),SIDES=['wei','shu','wu'];const q=new URLSearchParams(location.search);$('code').value=(q.get('code')||'').toUpperCase();$('name').value=localStorage.getItem('rotk-name')||'';
let hostToken='',playerToken='',mySide='',current=null,activeCode='';const key=()=>`rotk-${activeCode}`;function persist(){localStorage.setItem(key()+'-host',hostToken);localStorage.setItem(key()+'-token',playerToken);localStorage.setItem(key()+'-side',mySide);localStorage.setItem('rotk-name',$('name').value)}
function restore(){hostToken=localStorage.getItem(key()+'-host')||'';playerToken=localStorage.getItem(key()+'-token')||'';mySide=localStorage.getItem(key()+'-side')||''}function selectRoom(code){activeCode=code.toUpperCase();restore();$('roomtitle').textContent=activeCode;$('roomdetail').hidden=false;document.querySelector('.workspace').classList.add('has-room');$('create').disabled=true;$('code').disabled=true;$('mode').disabled=true;localStorage.setItem('rotk-active-room',activeCode);history.replaceState(null,'','/lobby?code='+encodeURIComponent(activeCode))}function clearRoom(){activeCode='';hostToken='';playerToken='';mySide='';current=null;$('slots').replaceChildren();$('roomdetail').hidden=true;document.querySelector('.workspace').classList.remove('has-room');$('create').disabled=false;$('code').disabled=false;$('mode').disabled=false;localStorage.removeItem('rotk-active-room');history.replaceState(null,'','/lobby')}
function msg(t){$('msg').textContent=t}async function api(route,body){const r=await fetch('/api/lobby/'+route+'?code='+encodeURIComponent(activeCode),{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function gameUrl(){return '/classic?code='+encodeURIComponent(activeCode)+'&side='+mySide+'&token='+encodeURIComponent(playerToken)}
function render(j){if(!activeCode||j.code!==activeCode)return;current=j;$('slots').innerHTML='';for(const side of SIDES){const slot=j.slots[side],box=document.createElement('div');box.className='faction';const left=document.createElement('div');left.innerHTML='<strong class="'+side+'">'+side.toUpperCase()+'</strong><small></small>';left.querySelector('small').textContent=slot.kind==='human'?(slot.name||'Player'):slot.kind==='ai'?'Computer AI':'Open · Waiting for player';box.appendChild(left);const buttons=document.createElement('div');buttons.className='controls';function btn(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;buttons.appendChild(b)}
if(!j.started){if(slot.kind==='open')btn(mySide&&playerToken?'Switch':'Join',()=>run(async()=>{const x=await api('claim',{side,name:$('name').value||'Player',playerToken});playerToken=x.playerToken;mySide=side;persist();render(x);msg('Joined '+side.toUpperCase()+' faction.')}));if(hostToken&&slot.kind!=='human'){btn('AI',()=>change(side,'ai'));btn('Open',()=>change(side,'open'))}}if(mySide===side&&playerToken)btn('You ✓',()=>{});box.appendChild(buttons);$('slots').appendChild(box)}
$('start').style.display=hostToken&&!j.started?'inline-block':'none';$('start').disabled=SIDES.some(s=>j.slots[s].kind==='open')||!SIDES.some(s=>j.slots[s].kind==='human');$('enter').style.display=j.started&&mySide&&j.slots[mySide].kind==='human'?'inline-block':'none';$('waiting').style.display=!j.started?'inline':'none';if(j.started)msg('Game started · '+SIDES.map(s=>s.toUpperCase()+': '+j.slots[s].kind).join(' · '));}
async function run(fn){try{await fn()}catch(e){msg(e.message)}}async function change(side,kind){await run(async()=>render(await api('slot',{hostToken,side,kind})))}
$('create').onclick=()=>run(async()=>{if(activeCode)return msg('Exit current room first');const code=$('code').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{1,12}$/.test(code))return alert('Room code: 1–12 letters, numbers, _ or -');activeCode=code;try{const j=await api('create',{mode:Number($('mode').value)});selectRoom(code);hostToken=j.hostToken;persist();render(j);msg('Room created. Choose a faction or assign AI.')}catch(e){activeCode='';throw e}});$('open').onclick=()=>run(async()=>{render(await api('state'));msg('Room refreshed.')});$('start').onclick=()=>run(async()=>render(await api('start',{hostToken})));$('enter').onclick=()=>location.href=gameUrl();$('copy').onclick=()=>{const url=location.origin+'/lobby?code='+encodeURIComponent(activeCode);navigator.clipboard?.writeText(url).then(()=>msg('Room link copied')).catch(()=>msg(url))};

let lastChatId=0,communityBusy=false;
function chatStatus(t){$('chatstatus').textContent=t}
async function communityApi(path,body){const r=await fetch('/api/lobby/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Community request failed');return j}
function appendChat(m){const log=$('chatlog'),nearBottom=log.scrollHeight-log.scrollTop-log.clientHeight<65;const line=document.createElement('div');line.className='chatline';const name=document.createElement('b');name.textContent=m.name;line.appendChild(name);const time=document.createElement('small');time.textContent=' · '+new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});line.appendChild(time);const body=document.createElement('span');body.textContent=': '+m.message;line.appendChild(body);if(m.invite){const a=document.createElement('a');a.href='/lobby?code='+encodeURIComponent(m.invite);a.textContent='  [Join '+m.invite+']';line.appendChild(a)}log.appendChild(line);while(log.children.length>120)log.firstChild.remove();if(nearBottom)log.scrollTop=log.scrollHeight}
function renderRooms(rooms){const list=$('roomlist');list.replaceChildren();if(!rooms.length){list.textContent='No active rooms yet. Create one above!';return}for(const r of rooms){const row=document.createElement('div');row.className='roomitem';const desc=document.createElement('div');const name=document.createElement('b');name.textContent=r.code;desc.appendChild(name);const detail=document.createElement('div');detail.className='muted';detail.textContent=r.started?'In game':r.players+' player(s) · '+r.open+' open · '+r.mode+'s turns';desc.appendChild(detail);row.appendChild(desc);const b=document.createElement('button');b.textContent=r.started?'View':'Join';b.onclick=async()=>{if(activeCode&&activeCode!==r.code){msg('Exit current room before joining another');return}selectRoom(r.code);try{render(await api('state'));msg('Room '+r.code+' loaded. Choose your faction.')}catch(e){msg(e.message);clearRoom()}};row.appendChild(b);list.appendChild(row)}}
async function pollCommunity(){if(communityBusy)return;communityBusy=true;try{const j=await communityApi('community?since='+lastChatId);for(const m of j.messages){if(m.id>lastChatId){appendChat(m);lastChatId=m.id}}renderRooms(j.rooms)}catch(e){chatStatus('Chat temporarily unavailable')}finally{communityBusy=false}}
$('chatform').onsubmit=async e=>{e.preventDefault();const message=$('chattext').value.trim();if(!message)return;try{await communityApi('chat',{name:$('name').value||'Guest',message});$('chattext').value='';chatStatus('');await pollCommunity()}catch(err){chatStatus(err.message)}};
$('invite').onclick=async()=>{const code=activeCode;if(!current||current.code!==code){chatStatus('Create or join a room first');return}try{await communityApi('chat',{name:$('name').value||'Guest',message:'Join my room '+code+'! '+(current.started?'Game in progress':'Waiting for players'),invite:code});chatStatus('Room invite posted');await pollCommunity()}catch(e){chatStatus(e.message)}};
pollCommunity();setInterval(pollCommunity,1800);
$('exit').onclick=()=>run(async()=>{if(!activeCode)return;const code=activeCode;await api('exit',{hostToken,playerToken,side:mySide});localStorage.removeItem(key()+'-host');localStorage.removeItem(key()+'-token');localStorage.removeItem(key()+'-side');clearRoom();$('code').value='';chatStatus('Exited room '+code);await pollCommunity()});
setInterval(async()=>{if(!current||!activeCode)return;try{render(await api('state'))}catch(e){if(e.message==='Room not found')clearRoom()}},1300);
const initialRoom=(q.get('code')||localStorage.getItem('rotk-active-room')||'').toUpperCase();if(initialRoom){selectRoom(initialRoom);api('state').then(render).catch(()=>clearRoom())}

</script></body></html>
