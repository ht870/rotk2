<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROTK · Multiplayer Lobby</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:radial-gradient(ellipse at top,#263d52,#09131f 75%);color:#eee2c9;font:15px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(660px,94vw);background:#152638ee;border:1px solid #b69a5e;border-radius:16px;padding:28px;box-shadow:0 24px 70px #0008}h1{font:700 32px Georgia;margin:0 0 8px;color:#f4d28d}.sub{color:#b7c3ce;margin:0 0 20px}input,select,button{font:inherit;padding:10px;border-radius:7px;background:#22394d;color:#fff;border:1px solid #748598}button{cursor:pointer;background:#795b2e;border-color:#bd9d5c}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.faction{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1c3043;border:1px solid #42576b;border-radius:10px;padding:14px;margin:10px 0}.faction strong{font:700 23px Georgia}.faction small{display:block;color:#9bb0bd}.controls{display:flex;gap:6px}.controls button{font-size:13px;padding:7px 11px}.wei{color:#80b7fa}.shu{color:#7ddca6}.wu{color:#f79a89}#msg{min-height:24px;color:#f0b28f}#gameLink{overflow-wrap:anywhere}.muted{font-size:12px;color:#9db0bf}#waiting{display:none}
</style></head><body><main><h1>⚔ Three Kingdoms</h1><p class="sub">Multiplayer lobby · Choose your faction or assign AI opponents</p>
<div class="row"><label>Room <input id="code" maxlength="12" placeholder="CAOCAO23"></label><label>Player <input id="name" maxlength="24" placeholder="Your name"></label><label>Turn <select id="mode"><option value="20">20s</option><option value="60">60s</option><option value="180">3 min</option><option value="300" selected>5 min</option></select></label></div>
<div class="row" style="margin:14px 0"><button id="create">Create Room</button><button id="open">Join Room</button><button id="copy">Copy Room Link</button></div>
<p id="msg"></p><section id="slots"></section><div class="row"><button id="start" style="display:none">▶ Start Game</button><button id="enter" style="display:none">Enter Game</button><span id="waiting" class="muted">Waiting for host to start…</span></div><p class="muted">Host fills empty slots with AI. All three factions must be occupied before starting. Share the room URL with friends.</p></main>
<script>
const $=id=>document.getElementById(id),SIDES=['wei','shu','wu'];const q=new URLSearchParams(location.search);$('code').value=(q.get('code')||'CAOCAO23').toUpperCase();$('name').value=localStorage.getItem('rotk-name')||'';
let hostToken='',playerToken='',mySide='',current=null;const key=()=>`rotk-${$('code').value.toUpperCase()}`;function persist(){localStorage.setItem(key()+'-host',hostToken);localStorage.setItem(key()+'-token',playerToken);localStorage.setItem(key()+'-side',mySide);localStorage.setItem('rotk-name',$('name').value)}
function restore(){hostToken=localStorage.getItem(key()+'-host')||'';playerToken=localStorage.getItem(key()+'-token')||'';mySide=localStorage.getItem(key()+'-side')||''}restore();
function msg(t){$('msg').textContent=t}async function api(route,body){const r=await fetch('/api/lobby/'+route+'?code='+encodeURIComponent($('code').value.toUpperCase()),{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function gameUrl(){return '/classic?code='+encodeURIComponent($('code').value.toUpperCase())+'&side='+mySide+'&token='+encodeURIComponent(playerToken)}
function render(j){current=j;$('slots').innerHTML='';for(const side of SIDES){const slot=j.slots[side],box=document.createElement('div');box.className='faction';const left=document.createElement('div');left.innerHTML='<strong class="'+side+'">'+side.toUpperCase()+'</strong><small></small>';left.querySelector('small').textContent=slot.kind==='human'?(slot.name||'Player'):slot.kind==='ai'?'Computer AI':'Open · Waiting for player';box.appendChild(left);const buttons=document.createElement('div');buttons.className='controls';function btn(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;buttons.appendChild(b)}
if(!j.started){if(slot.kind==='open')btn('Join',()=>run(async()=>{const x=await api('claim',{side,name:$('name').value||'Player',playerToken});playerToken=x.playerToken;mySide=side;persist();render(x)}));if(hostToken&&slot.kind!=='human'){btn('AI',()=>change(side,'ai'));btn('Open',()=>change(side,'open'))}}if(mySide===side&&playerToken)btn('You ✓',()=>{});box.appendChild(buttons);$('slots').appendChild(box)}
$('start').style.display=hostToken&&!j.started?'inline-block':'none';$('start').disabled=SIDES.some(s=>j.slots[s].kind==='open')||!SIDES.some(s=>j.slots[s].kind==='human');$('enter').style.display=j.started&&mySide&&j.slots[mySide].kind==='human'?'inline-block':'none';$('waiting').style.display=!j.started?'inline':'none';if(j.started)msg('Game started · '+SIDES.map(s=>s.toUpperCase()+': '+j.slots[s].kind).join(' · '));}
async function run(fn){try{await fn()}catch(e){msg(e.message)}}async function change(side,kind){await run(async()=>render(await api('slot',{hostToken,side,kind})))}
$('create').onclick=()=>run(async()=>{const j=await api('create',{mode:Number($('mode').value)});hostToken=j.hostToken;persist();render(j);msg('Room created. Choose your faction, then assign AI or invite friends.')});$('open').onclick=()=>run(async()=>{restore();render(await api('state'));msg('Room loaded. Choose an Open faction.')});$('start').onclick=()=>run(async()=>render(await api('start',{hostToken})));$('enter').onclick=()=>location.href=gameUrl();$('copy').onclick=()=>{const url=location.origin+'/lobby?code='+encodeURIComponent($('code').value.toUpperCase());navigator.clipboard?.writeText(url).then(()=>msg('Room link copied')).catch(()=>msg(url))};
$('code').addEventListener('change',()=>{restore();$('slots').innerHTML='';current=null});setInterval(async()=>{if(!current)return;try{render(await api('state'))}catch(e){}},1300);api('state').then(render).catch(()=>msg('Create a new room or enter an existing room code.'));
</script></body></html>
